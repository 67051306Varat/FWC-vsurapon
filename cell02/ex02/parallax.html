<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax</title>
    <link rel="stylesheet" href="parallax.css">
</head>
<body>

    <!-- First Parallax Image Block -->
    <div class="parallax img1">
        <div class="caption">
            <span class="text">First Parallax Image</span>
        </div>
    </div>

    <!-- Middle Content Block -->
    <div class="block">
        <h3>Section Title</h3>
        <p>This is a black block section with custom text in the middle of your page.</p>
    </div>

    <!-- Second Parallax Image Block -->
    <div class="parallax img2">
        <div class="caption">
            <span class="text">Second Parallax Image</span>
        </div>
    </div>

</body>
</html>
