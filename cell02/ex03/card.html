<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <!-- Header on top of card -->
        <header class="card-header">
            <h2>User Profile</h2>
        </header>

        <!-- Invisible table for alignment -->
        <table class="profile-table">
            <tr>
                <td>
                    <!-- Profile Picture -->
                    <img src="https://stickershop.line-scdn.net/stickershop/v1/product/35849019/LINEStorePC/main.png?v=1" alt="Profile Picture" class="profile-img">
                </td>
            </tr>
            <tr>
                <td>
                    <!-- Login under picture -->
                    <h3 class="login">Varat</h3>
                </td>
            </tr>
            <tr>
                <td>
                    <!-- 2-3 words description -->
                    <p class="description">Piscine Web Student</p>
                </td>
            </tr>
            <tr>
                <td>
                    <!-- Small social network images -->
                    <div class="social-links">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRYQ-pRHtUzC9jhVnZeV73aoJevLkQ5XHIEDb-HjGQSXw&s" alt="withonlynan">
                        <img src="https://sf-static.tiktokcdn.com/obj/eden-sg/uhtyvueh7nulogpoguhm/tiktok-icon2.png" alt="nexistttt">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSIGwPo-he6o2qntz8LfJchyc9Okm151ZYbIqZl2hoObQbx0yhbgMDGwAg&s=10https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSIGwPo-he6o2qntz8LfJchyc9Okm151ZYbIqZl2hoObQbx0yhbgMDGwAg&s=10" alt="Facebook">
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <!-- Clickable Contact button -->
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
