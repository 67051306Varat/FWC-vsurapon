<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            padding: 40px 60px;
            font-family: sans-serif;
            border: 1px solid black;
        }
        .cell-one {
            background-color: #bffce6;
        }
        .cell-two {
            background-color: #4d2b25;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="cell-one">First cell</td>
            <td class="cell-two">Second cell</td>
        </tr>
    </table>

</body>
</html>
